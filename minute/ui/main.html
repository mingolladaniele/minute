<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>minute</title>
<style>
  :root {
    --bg: #f7f6f1;
    --card: #ffffff;
    --ink: #1b1b1d;
    --muted: #75736d;
    --faint: #aeaba3;
    --line: #e6e3da;
    --hover: #eeece5;
    --chip: #ffffff;
    --dark: #1d1d20;
    --on-dark: #f7f6f1;
    --rec: #e5484d;
    --live: #3fb950;
    --them: #ecE9e1;
    --shadow: 0 10px 40px rgba(30, 28, 20, .12), 0 1px 3px rgba(30, 28, 20, .08);
    --serif: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618;
      --card: #1e1e21;
      --ink: #ececea;
      --muted: #96948e;
      --faint: #5e5d59;
      --line: #2c2c2f;
      --hover: #232326;
      --chip: #1e1e21;
      --dark: #ececea;
      --on-dark: #161618;
      --them: #29292c;
      --shadow: 0 10px 40px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  svg { display: block; }
  .hidden { display: none !important; }

  /* --- top bar --- */
  .topbar {
    height: 64px; padding: 0 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .brand img { width: 26px; height: 26px; }
  .navpill {
    display: flex; align-items: center; height: 36px; padding: 0 4px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--chip);
  }
  .navpill button { height: 28px; padding: 0 12px 0 8px; display: flex; align-items: center; gap: 4px; border-radius: 999px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
  .navpill button:hover { background: var(--hover); color: var(--ink); }
  .right { display: flex; align-items: center; gap: 8px; }
  .btn-dark {
    height: 36px; padding: 0 16px; border-radius: 999px;
    background: var(--dark); color: var(--on-dark); font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
    transition: transform .08s ease, opacity .15s;
  }
  .btn-dark:active { transform: scale(.97); }
  .btn-dark:disabled { opacity: .5; cursor: default; }
  .btn-dark .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
  .icon-btn { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }

  .menu {
    position: absolute; top: 56px; right: 22px; z-index: 20; min-width: 200px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    padding: 6px;
  }
  .menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  .menu button:hover { background: var(--hover); }
  .menu .danger { color: var(--rec); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

  .scroll { height: calc(100% - 64px); overflow-y: auto; }
  .page { max-width: 700px; margin: 0 auto; padding: 18px 40px 160px; }

  /* --- home --- */
  .home > .group:first-child, .home > .banner + .group { margin-top: 4px; }
  .group { display: flex; gap: 8px; align-items: baseline; margin: 26px 0 6px; font-size: 13px; font-weight: 600; }
  .group span { color: var(--faint); font-weight: 500; }
  .row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 11px 12px; margin: 0 -12px; border-radius: 10px;
  }
  .row:hover { background: var(--hover); }
  .row .doc {
    width: 34px; height: 34px; flex: none; border-radius: 9px;
    display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .row.live .doc { color: var(--rec); }
  .row .title { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 70px 20px; }
  .empty img { width: 56px; height: 56px; margin-bottom: 16px; }
  .empty h2 { font: 400 24px/1.2 var(--serif); color: var(--ink); margin: 0 0 8px; }
  .empty p { margin: 0 auto; max-width: 380px; }

  /* --- note --- */
  .note-title {
    font: 400 38px/1.15 var(--serif); letter-spacing: -.012em;
    margin: 4px 0 16px; outline: none; overflow-wrap: anywhere;
  }
  .note-title:empty::before { content: attr(data-placeholder); color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip {
    height: 32px; padding: 0 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--chip); color: var(--muted); font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  .notes {
    min-height: 50vh; outline: none; font: 16px/1.7 var(--sans); color: var(--ink);
    overflow-wrap: anywhere; caret-color: var(--ink);
  }
  .notes.is-empty::before { content: "Write notes"; color: var(--faint); position: absolute; pointer-events: none; }
  .notes p { margin: 0 0 6px; }
  .notes h1, .notes h2, .notes h3 { font-family: var(--serif); font-weight: 400; letter-spacing: -.01em; margin: 18px 0 6px; line-height: 1.25; }
  .notes h1 { font-size: 26px; }
  .notes h2 { font-size: 21px; }
  .notes h3 { font-size: 18px; }
  .notes ul, .notes ol { margin: 2px 0 8px; padding-left: 24px; }
  .notes li { margin: 2px 0; padding-left: 2px; }
  .notes ul ul, .notes ol ul { list-style: circle; }
  .notes li::marker { color: var(--muted); }
  .notes strong, .notes b { font-weight: 650; }
  .notes code { font: 14px Consolas, monospace; background: var(--hover); padding: 1px 5px; border-radius: 5px; }

  /* --- transcript dock + panel --- */
  .dock {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10;
    height: 40px; padding: 0 4px; border-radius: 999px;
    display: flex; align-items: center; gap: 2px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    font-size: 14px; font-weight: 500;
  }
  .dock-main { height: 32px; padding: 0 12px 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 10px; }
  .dock-main:hover { background: var(--hover); }
  .dock-stop { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
  .dock-stop span { width: 10px; height: 10px; border-radius: 2px; background: var(--ink); }
  .dock-stop:hover { background: var(--rec); }
  .dock-stop:hover span { background: #fff; }
  .dock .wave { display: flex; align-items: center; gap: 2px; height: 16px; }
  .dock .wave i { width: 3px; height: 4px; border-radius: 1.5px; background: var(--faint); transition: height .12s ease-out; }
  .dock.live .wave i { background: var(--live); }
  .dock .chev { color: var(--muted); transition: transform .2s; }
  .dock.open .chev { transform: rotate(180deg); }
  .panel {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 9;
    width: min(640px, calc(100% - 48px)); max-height: 58vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    padding: 18px 22px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
  .panel h3 button { color: var(--muted); font-size: 13px; font-weight: 500; }
  .panel h3 .raw { display: flex; gap: 12px; }
  .menu .label { padding: 8px 12px 4px; font-size: 11.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
  .panel h3 button:hover { color: var(--ink); }
  .talk { display: flex; flex-direction: column; gap: 5px; }
  .stamp { align-self: center; color: var(--faint); font-size: 11px; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 15px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.THEM { align-self: flex-start; background: var(--them); border-bottom-left-radius: 5px; }
  .bubble.YOU { align-self: flex-end; background: color-mix(in srgb, var(--live) 24%, var(--card)); border-bottom-right-radius: 5px; }
  .ghost { color: var(--faint); }

  .naming { color: var(--faint); animation: pulse 1.6s ease-in-out infinite; }
  .row .title.naming { font-weight: 500; }
  .note-title.naming::after { content: "Naming with AI…"; display: block; margin-top: 6px; font: 400 14px var(--sans); color: var(--faint); }

  /* --- banner (model download) --- */
  .banner {
    display: flex; align-items: center; gap: 16px; margin: 0 0 22px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--card);
  }
  .banner .msg { flex: 1; font-size: 14px; }
  .banner .msg b { display: block; font-weight: 600; }
  .banner .msg span { color: var(--muted); }
  .progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }

  /* --- settings --- */
  .settings h1 { font: 400 34px/1.15 var(--serif); letter-spacing: -.01em; margin: 6px 0 8px; }
  .settings h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 30px 0 8px; }
  .card { border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .setting { display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
  .setting + .setting { border-top: 1px solid var(--line); }
  .setting .label { flex: 1; min-width: 0; }
  .setting .label b { display: block; font-weight: 500; font-size: 14.5px; }
  .setting .label span { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .setting .label span span { display: inline; }
  .card > div:not(.setting) { border-top: 1px solid var(--line); }
  .setting select, .setting input[type=text], .setting input[type=password] {
    font: 14px var(--sans); color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; min-width: 0;
  }
  .setting input[type=text], .setting input[type=password] { width: 230px; }
  .setting select:focus, .setting input:focus { outline: 2px solid color-mix(in srgb, var(--ink) 25%, transparent); outline-offset: 1px; }
  .btn-line {
    height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--chip); font-size: 13.5px; font-weight: 500; white-space: nowrap;
  }
  .btn-line:hover { background: var(--hover); }
  .switch { position: relative; width: 40px; height: 24px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s;
  }
  .switch input:checked + i { background: var(--live); }
  .switch input:checked + i::after { transform: translateX(16px); }
  .seg { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .seg button { padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .ok { color: var(--live); }
  .bad { color: var(--rec); }
  .dim { opacity: .45; pointer-events: none; }

  .status {
    display: flex; align-items: flex-start; gap: 14px; margin: -10px 0 24px; padding: 12px 14px;
    border-radius: 12px; background: var(--hover); font-size: 13.5px; color: var(--muted);
  }
  .status b { color: var(--ink); font-weight: 600; }
  .status .grow { flex: 1; }
  .status .btn-line { height: 30px; font-size: 13px; }
  .row .flag { color: var(--faint); font-size: 12px; margin-left: 10px; font-weight: 500; }
  .chip.audio-only { color: var(--muted); }
  .chip.ending { color: var(--ink); }
  .chip.ending i { width: 7px; height: 7px; border-radius: 50%; background: #e0a43a; }
  .chip.keep { cursor: pointer; color: var(--ink); font-weight: 500; }
  .chip.keep:hover { background: var(--hover); }
  .chip.audio-only i { background: var(--faint); }

  .engine {
    display: inline-flex; align-items: center; gap: 7px; margin-left: 14px; padding: 4px 10px;
    border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--muted); background: var(--hover);
  }
  .engine i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .engine.ready i { background: var(--live); }
  .engine.loading i { animation: pulse 1.2s ease-in-out infinite; }
  .engine.missing i { background: #e0a43a; }
  .engine.error i { background: var(--rec); }

  .views { margin: -8px 0 22px; display: flex; }
  .views .seg button { padding: 5px 14px; font-size: 13.5px; }
  .enh-wait { color: var(--faint); font-size: 15px; padding: 4px 0; }
  .enh-wait b { color: var(--muted); font-weight: 500; animation: pulse 1.6s ease-in-out infinite; }

  .about-head { align-items: center; }
  .about-head img { width: 44px; height: 44px; }
  .about-head .label b { font-size: 16px; }
  .link { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; cursor: pointer; }
  .link:hover { text-decoration-color: var(--ink); }
  .changes { padding: 14px 16px; font-size: 14px; }
  .changes b { font-weight: 600; }
  .changes ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); }
  .changes li { margin: 3px 0; }
  .changes details { margin-top: 12px; }
  .changes summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .changes details > div { margin-top: 10px; }
  .changes details > div + div { margin-top: 14px; }
  .btns { display: flex; gap: 6px; }

  .toast {
    position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--dark); color: var(--on-dark); padding: 8px 16px; border-radius: 999px; font-size: 13.5px;
  }
  .toast.error { background: var(--rec); color: #fff; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand" id="brand"><img src="icon.png" alt="">minute<span class="engine" id="engine"><i></i><span></span></span></div>
  <div class="navpill hidden" id="nav">
    <button id="back" title="Back to your calls"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg><span>Calls</span></button>
  </div>
  <div class="right">
    <button class="btn-dark" id="primary"><span class="dot"></span><span id="primary-label">New note</span></button>
    <button class="icon-btn" id="gear" title="Settings"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 5.5h8M15 5.5h2M3 14.5h2M9 14.5h8"/><circle cx="13" cy="5.5" r="2"/><circle cx="7" cy="14.5" r="2"/></svg></button>
    <button class="icon-btn hidden" id="more" title="More"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="9" r="1.4"/></svg></button>
  </div>
</div>
<div class="menu hidden" id="menu">
  <button data-act="copy-notes">Copy notes</button>
  <button data-act="regen-enhanced">Regenerate enhanced notes</button>
  <button data-act="copy-transcript">Copy transcript</button>
  <button data-act="retitle">Regenerate title</button>
  <hr>
  <div class="label">Raw files</div>
  <button data-act="raw-them">Play their audio</button>
  <button data-act="raw-you">Play my audio</button>
  <button data-act="raw-text">Open raw live text</button>
  <button data-act="raw-folder">Open folder</button>
  <hr>
  <button data-act="delete" class="danger">Delete</button>
</div>

<div class="scroll" id="scroll">
  <section class="page home" id="home"></section>
  <section class="page hidden" id="note">
    <h1 class="note-title" id="title" contenteditable="true" spellcheck="false" data-placeholder="New call"></h1>
    <div class="chips" id="chips"></div>
    <div class="views hidden" id="views"><div class="seg">
      <button data-view="mine">My notes</button><button data-view="enhanced">✦ Enhanced</button>
    </div></div>
    <div class="status hidden" id="status"></div>
    <div class="enh-wait hidden" id="enh-wait"><b>Enhancing notes…</b> Your notes and the transcript are being turned into structured notes. Keep writing in My notes meanwhile.</div>
    <div class="notes" id="notes"></div>
  </section>
  <section class="page settings hidden" id="settings"></section>
</div>

<div class="panel hidden" id="panel"></div>
<div class="dock hidden" id="dock">
  <button class="dock-main" id="dock-toggle" title="Transcript">
    <span class="wave" id="wave"><i></i><i></i><i></i><i></i></span>
    <span>Transcript</span>
    <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 7.5 3-3 3 3"/></svg>
  </button>
  <button class="dock-stop hidden" id="dock-stop" title="Stop recording"><span></span></button>
</div>
<div class="toast hidden" id="toast"></div>

<script src="editor.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const api = () => window.pywebview.api;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON_DOC = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 1.8h5.5L12.5 5v9.2h-8.5z"/><path d="M9.3 2v3.2h3" /><path d="M6.3 8.5h4M6.3 11h3" stroke-linecap="round"/></svg>`;
const ICON_CAL = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.8" y="2.6" width="10.4" height="9.6" rx="2"/><path d="M1.8 5.6h10.4M4.6 1.3v2.4M9.4 1.3v2.4" stroke-linecap="round"/></svg>`;

const ui = {
  state: "idle",
  calls: [],
  view: "home",       // "home" | "note"
  call: null,         // saved call {id, title, started, duration, blocks, notes}
  live: null,         // {id, blocks, tentative, elapsed, title, notes}
  panelOpen: false,
  naming: new Set(),  // call ids whose AI title is being generated
  enhancing: new Set(),  // call ids whose enhanced notes are being generated
  noteView: "mine",      // "mine" | "enhanced"
  model: { ready: true, downloading: false, done: 0, total: 0, error: "" },
  engine: { state: "unloaded", error: null },
};
const viewingLive = () => ui.view === "note" && ui.live && !ui.call;

/* --- formatting --- */
function day(iso) {
  const d = new Date(iso), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}
const hhmm = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

function toast(msg, error = false) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("error", error);
  t.classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add("hidden"), error ? 6000 : 1600);
}

/* --- top bar --- */
function renderTopbar() {
  const inPage = ui.view !== "home";
  $("brand").classList.toggle("hidden", inPage);
  $("nav").classList.toggle("hidden", !inPage);
  $("gear").classList.toggle("hidden", inPage);
  $("more").classList.toggle("hidden", !(ui.view === "note" && ui.call));
  $("primary").classList.toggle("hidden", ui.state !== "idle"); // while recording, stop lives in the bottom control
}
$("primary").addEventListener("click", () => {
  if (ui.state === "idle" && !ui.model.ready) {
    showHome();
    toast("Download the speech model first");
  } else if (ui.state === "idle") api().start();
});
$("back").addEventListener("click", () => showHome());
$("gear").addEventListener("click", () => showSettings());

/* --- home --- */
function renderHome() {
  const el = $("home");
  let html = modelBanner();
  if (ui.live) {
    html += `<div class="group">Now</div>
      <button class="row live" data-id="live"><span class="doc">${ICON_DOC}</span>
      <span class="title">${esc(ui.live.title || "New call")}</span><span class="meta">Recording</span></button>`;
  }
  const groups = new Map();
  for (const c of ui.calls) {
    const g = day(c.started);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(c);

/* --- transcript dock + panel --- */
function blocksHtml(blocks, tentative) {
  const out = blocks.map((b) => ({ ...b, ghost: "" }));
  for (const label of ["THEM", "YOU"]) {
    const t = tentative?.[label]?.trim();
    if (!t) continue;
    const last = out[out.length - 1];
    if (last && last.label === label) last.ghost = t;
    else out.push({ label, t: "", text: "", ghost: t });
  }
  const secs = (t) => t.split(":").reduce((a, n) => a * 60 + Number(n), 0);
  let shown = -Infinity;
  const html = out.map((b) => {
    let stamp = "";
    if (b.t && secs(b.t) - shown >= 60) { // a time marker at most once a minute
      shown = secs(b.t);
      stamp = `<div class="stamp">${b.t}</div>`;
    }
    return `${stamp}<div class="bubble ${b.label}">${esc(b.text.trim())}${b.ghost ? `${b.text.trim() ? " " : ""}<span class="ghost">${esc(b.ghost)}</span>` : ""}</div>`;
  }).join("");
  return html ? `<div class="talk">${html}</div>` : "";
}
function renderDock() {

  $("dock").classList.toggle("hidden", !show);
  $("dock").classList.toggle("live", viewingLive() && ui.state === "recording");

  $("panel").classList.toggle("hidden", !(show && ui.panelOpen));

function renderPanel() {
  const p = $("panel");
  const live = viewingLive();
  const blocks = live ? ui.live.blocks : ui.call?.blocks || [];
  const atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 40;
  const body = blocksHtml(blocks, live ? ui.live.tentative : null);
  const empty = live
    ? (ui.live.off ? `Live text is unavailable (${esc(ui.live.off)}). The audio is being saved and will be transcribed later.` : "Listening. Text appears here as people speak.")
    : (ui.call?.transcript === "pending" ? "The transcript isn't ready yet." : "Nothing was transcribed.");
  const raw = live ? "" : `<span class="raw">
      ${(ui.call?.audio || []).map((t) => `<button data-raw="${t}">${t === "them" ? "Their audio" : "My audio"}</button>`).join("")}
      <button data-raw="text">Raw text</button><button data-raw="folder">Folder</button>
      <button id="copy-tr">Copy</button></span>`;
  p.innerHTML = `<h3>Transcript ${raw}</h3>${body || `<p class="ghost">${empty}</p>`}`;
  if (live && atBottom) p.scrollTop = p.scrollHeight;
  $("copy-tr")?.addEventListener("click", async () => {
    await navigator.clipboard.writeText(blocks.map((b) => `${b.label} ${b.t}\n${b.text}`).join("\n\n"));
    toast("Transcript copied");
  });
}

// Every language the speech model supports, named by the browser ("sv-SE" -> "Swedish (Sweden)").
function languageOptions(codes, preferred) {
  const names = new Intl.DisplayNames(["en"], { type: "language" });
  const named = codes.map((c) => [c, names.of(c.replace("ar-AR", "ar")) || c]).sort((a, b) => a[1].localeCompare(b[1]));
  const first = named.filter(([c]) => c === preferred);
  return [["auto", "Detect automatically (recommended)"], ...first, ...named.filter(([c]) => c !== preferred)];
}

// CHANGELOG.md -> [{version, date, items}], newest first
function parseChangelog(md) {
  return md.split(/^## /m).slice(1).map((sec) => {
    const [head, ...rest] = sec.split(/\r?\n/);
    const m = head.match(/^(\S+)\s*(?:\((.*)\))?/);
    return { version: m[1], date: m[2] || "", items: rest.filter((l) => l.startsWith("- ")).map((l) => l.slice(2)) };
  });
}

async function saveSetting(values) {
  prefs = await api().save_settings(values);
  toast("Saved");
}
$("settings").addEventListener("change", (e) => {
  const el = e.target.closest("[data-key]");
  if (!el) return;
  const value = el.type === "checkbox" ? el.checked : el.value.trim();
  saveSetting({ [el.dataset.key]: value }).then(() => {
    if (el.dataset.key === "ai_titles" || el.dataset.key === "ai_enhance") renderSettings();
  });
});
$("settings").addEventListener("click", async (e) => {
  const prov = e.target.closest("#provider button");
  const seg = e.target.closest("#key-source button");
  if (prov) {
    if (prov.dataset.v !== providerOf(prefs)) await saveSetting(PROVIDER_PRESETS[prov.dataset.v]);
    renderSettings();
  } else if (seg) {
    await saveSetting({ ai_key_source: seg.dataset.v });
    renderSettings();
  } else if (e.target.closest("#pick-folder")) {
    const dir = await api().choose_folder();
    if (dir) {
      await saveSetting({ recordings_dir: dir });
      ui.calls = await api().list_calls();
      renderSettings();
    }
  } else if (e.target.closest("#test-ai")) {
    $("ai-test").textContent = "Asking the model…";
    const r = await api().test_ai();
    $("ai-test").innerHTML = r.ok ? `<span class="ok">Works.</span> Title: “${esc(r.title || "")}”` : `<span class="bad">${esc(r.error)}</span>`;
  }
});

document.addEventListener("click", (e) => {
  const link = e.target.closest("[data-url]");
  if (link) { e.preventDefault(); api().open_url(link.dataset.url); return; }
  const b = e.target.closest("[data-raw]");
  if (b && ui.call) api().open_raw(ui.call.id, b.dataset.raw);
});

/* --- events from Python --- */
window.minute = {
  async onEvent(ev) {
    if (ev.type === "state") {
      const prev = ui.state;
      ui.state = ev.state;
      if (ev.state === "loading" && prev === "idle") {
        ui.live = { id: null, blocks: [], tentative: {}, elapsed: 0, title: "", notes: "", auto: !!ev.auto, ending: null };
        openLive();
        editor.focus();
      }
      if (ev.state === "recording" && ui.live && !ui.live.id) {
        ui.live.id = ev.call_id;
        flushSave();
      }
      if (ev.state === "idle" && prev !== "idle") {
        clearTimeout(saveTimer);
        await flushSave();
        const wasViewing = viewingLive();
        ui.live = null;
        ui.calls = await api().list_calls();
        setWave(0);
        if (wasViewing && ev.call_id && ui.calls.some((c) => c.id === ev.call_id)) await openCall(ev.call_id);
        else if (wasViewing) showHome();
        else if (ui.view === "home") renderHome();
      }
      renderTopbar();
      if (ui.view === "note") { renderChips(); renderDock(); }
      if (ui.view === "home") renderHome();
    } else if (ev.type === "text" && ui.live) {
      const blocks = ui.live.blocks, last = blocks[blocks.length - 1];
      if (ev.delta) {
        if (last && last.label === ev.label) last.text += ev.delta;
        else if (ev.delta.trim()) blocks.push({ label: ev.label, t: ev.t, text: ev.delta });
      }
      ui.live.tentative[ev.label] = ev.tentative;
      if (viewingLive() && ui.panelOpen) renderPanel();
    } else if (ev.type === "levels" && ui.live) {
      ui.live.elapsed = ev.elapsed;
      if (viewingLive()) setWave(Math.max(ev.YOU || 0, ev.THEM || 0));
    } else if (ev.type === "titling") {
      ui.naming.add(ev.call_id);
      refreshTitles();
    } else if (ev.type === "title") {
      ui.naming.delete(ev.call_id);
      await refreshCall(ev.call_id);  // failures show inline on the note, not as toasts: retries are automatic
    } else if (ev.type === "transcribing") {
      ui.transcribing = ev.call_id;
      await refreshCall(ev.call_id);
    } else if (ev.type === "call_updated") {
      if (ui.transcribing === ev.call_id) ui.transcribing = null;
      await refreshCall(ev.call_id);
    } else if (ev.type === "transcription_off" && ui.live) {
      ui.live.off = ev.reason;
      if (viewingLive()) { renderChips(); if (ui.panelOpen) renderPanel(); }
    } else if (ev.type === "call_ending" && ui.live) {
      ui.live.ending = ev.seconds;
      if (viewingLive()) renderChips();
    } else if (ev.type === "enhancing") {
      ui.enhancing.add(ev.call_id);
      await refreshCall(ev.call_id);
    } else if (ev.type === "enhanced") {
      ui.enhancing.delete(ev.call_id);
      const typing = document.activeElement === $("notes");
      await refreshCall(ev.call_id);
      if (!ev.error && ui.view === "note" && ui.call?.id === ev.call_id && !typing && ui.call.enhanced) {
        ui.noteView = "enhanced";  // the structured notes take over once they're ready
        renderNote();
      }
    } else if (ev.type === "engine") {
      ui.engine = { state: ev.state, error: ev.error };
      if (ev.state === "ready") ui.model.ready = true;
      renderEngine();
      if (ui.view === "home") renderHome();
    } else if (ev.type === "discarded") {
      toast("Short recording discarded");
    } else if (ev.type === "model_missing") {
      ui.model.ready = false;
      if (ui.view === "home") renderHome();
    } else if (ev.type === "download") {
      Object.assign(ui.model, { downloading: true, done: ev.done, total: ev.total });
      if (ui.view === "home") renderHome();
    } else if (ev.type === "download_done") {
      Object.assign(ui.model, { ready: true, downloading: false });
      toast("Speech model ready");
      if (ui.view === "home") renderHome();
    } else if (ev.type === "download_error") {
      Object.assign(ui.model, { downloading: false, error: ev.message });
      if (ui.view === "home") renderHome();
    } else if (ev.type === "error") {
      toast(`Something went wrong: ${ev.message}`, true);
    }
  },
};

function refreshTitles() {
  if (ui.view === "home") renderHome();
  else if (ui.view === "note" && ui.call) renderNote();
}

window.addEventListener("pywebviewready", async () => {
  ui.calls = await api().list_calls();
  const s = await api().status();
  ui.state = s.state;
  Object.assign(ui.model, { ready: s.model_ready, downloading: s.downloading });
  ui.engine = { state: s.engine, error: s.engine_error };
  renderEngine();
  showHome();
});
</script>
